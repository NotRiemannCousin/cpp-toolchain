name: Build toolchain images

on:
  push:
    branches: [main]
    paths:
      - "linux/Dockerfile"
      - "shared/cpm-warmup/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./linux/Dockerfile
          push: true
          tags: |
            ghcr.io/notriemanncousin/cpp-ci-linux:gcc16.2
            ghcr.io/notriemanncousin/cpp-ci-linux:gcc16.2-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pinned reference
        run: |
          echo "Fixe os consumidores em:"
          echo "  ghcr.io/notriemanncousin/cpp-ci-linux:gcc16.2-${{ github.sha }}"
          echo "Ou, para pin por digest (mais rígido ainda):"
          echo "  ghcr.io/notriemanncousin/cpp-ci-linux@${{ steps.build.outputs.digest }}"

